# Pre-commit: format check, lint, typecheck (applies to entire workspace)
# Install: npx lefthook install  (or Tasks: Run Task → pnpm: lefthook install)
pre-commit:
  parallel: true
  commands:
    doctrine:
      run: pnpm run check:doctrine
    format:
      run: pnpm run format:check
    lint:
      run: pnpm run lint
    typecheck:
      run: pnpm run typecheck

pre-push:
  commands:
    test:
      run: pnpm run test

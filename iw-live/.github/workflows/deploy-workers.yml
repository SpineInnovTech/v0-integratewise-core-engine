# ────────────────────────────────────────────────────────────────────────
# Selective Worker Deployment
#
# Deploys only the Cloudflare Workers whose code actually changed.
# Uses the v3.6 consolidated worker dependency map:
#   - Sub-service changes trigger parent worker redeploy
#     (e.g., normalizer change → pipeline redeploy)
#   - Shared package changes (packages/**) → ALL workers redeploy
#   - Each worker is a separate matrix job (parallel, fail-fast: false)
#
# Trigger: push to main (services/**, packages/**) or manual dispatch
# ────────────────────────────────────────────────────────────────────────
name: Deploy Workers (Selective)

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-workers.yml"
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (or "all")'
        required: true
        default: "all"
        type: choice
        options:
          - all
          - gateway
          - pipeline
          - connector
          - connector-sync
          - intelligence
          - knowledge
          - workflow
          - l2
          - tenants
          - think
          - admin
          - billing
          - webhook-ingress
          - mcp-connector

concurrency:
  group: deploy-workers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  WRANGLER_SEND_METRICS: "false"

jobs:
  # ======================================================================
  # Step 1: Detect which workers need deployment
  # ======================================================================
  detect:
    name: Detect Changed Workers
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      count: ${{ steps.detect.outputs.count }}
      services: ${{ steps.detect.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect deploy targets
        id: detect
        run: |
          ALL_SERVICES='["gateway","pipeline","connector","connector-sync","intelligence","knowledge","workflow","l2","tenants","think","admin","billing","webhook-ingress","mcp-connector"]'

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SVC="${{ inputs.service }}"
            if [[ "$SVC" == "all" ]]; then
              TARGETS_JSON="$ALL_SERVICES"
            else
              TARGETS_JSON="[\"$SVC\"]"
            fi
          else
            chmod +x scripts/detect-deploy-targets.sh
            TARGETS_JSON=$(scripts/detect-deploy-targets.sh)
          fi

          COUNT=$(echo "$TARGETS_JSON" | jq 'length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "services=$TARGETS_JSON" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -eq 0 ]; then
            echo "::notice::No workers need deployment"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
          else
            # Build matrix JSON for parallel deploy jobs
            MATRIX=$(echo "$TARGETS_JSON" | jq -c '{include: [.[] | {service: .}]}')
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
            NAMES=$(echo "$TARGETS_JSON" | jq -r 'join(", ")')
            echo "::notice::Deploying $COUNT workers: $NAMES"
          fi

  # ======================================================================
  # Step 2: Deploy each changed worker (parallel matrix)
  # ======================================================================
  deploy:
    name: Deploy ${{ matrix.service }}
    needs: detect
    if: needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy ${{ matrix.service }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CONFIG="services/${{ matrix.service }}/wrangler.toml"

          if [[ ! -f "$CONFIG" ]]; then
            echo "::error::No wrangler.toml found at $CONFIG"
            exit 1
          fi

          echo "Deploying ${{ matrix.service }}..."

          # Use correct environment flag based on wrangler.toml config
          if grep -q '\[env\.production\]' "$CONFIG"; then
            npx wrangler deploy -c "$CONFIG" --env production --keep-vars
          elif grep -q '\[env\.prod\]' "$CONFIG"; then
            npx wrangler deploy -c "$CONFIG" --env prod --keep-vars
          else
            npx wrangler deploy -c "$CONFIG" --keep-vars
          fi

          echo "Deployed ${{ matrix.service }}"

  # ======================================================================
  # Step 3: Summary
  # ======================================================================
  summary:
    name: Deployment Summary
    needs: [detect, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Workers Deployment (Selective)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Workers detected:** ${{ needs.detect.outputs.count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Services:** ${{ needs.detect.outputs.services }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deploy result:** ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY

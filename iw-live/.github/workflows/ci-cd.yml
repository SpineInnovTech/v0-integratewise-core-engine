# CI/CD Pipeline - Build, Test, Deploy
# DISABLED: Superseded by deploy-workers.yml (selective) + deploy-frontend.yml
# This workflow used outdated pnpm/action-setup@v2 and deployed all workers
# unconditionally. The new deploy-workers.yml handles selective deployment
# with the v3.6 consolidated worker dependency map.
#
# Keeping file for reference — remove when confident in new pipeline.

name: "CI/CD Pipeline (DISABLED)"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "This workflow is disabled. Use deploy-workers.yml instead."
        required: true
        default: "I understand"

jobs:
  # Build and Test Job
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm run test
        continue-on-error: false

      - name: Build packages
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            packages/*/dist
            services/*/dist

  # Deploy Job (only on main branch push)
  deploy:
    name: Deploy to Production
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      # Deploy services in dependency order
      - name: Deploy Normalizer
        run: |
          cd services/normalizer
          pnpm exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Loader
        run: |
          cd services/loader
          pnpm exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Knowledge
        run: |
          cd services/knowledge
          pnpm exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Workflow
        run: |
          cd services/workflow
          pnpm exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Think
        run: |
          cd services/think
          pnpm exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy MCP Connector
        run: |
          cd services/mcp-connector
          pnpm exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Gateway (Last)
        run: |
          cd services/gateway
          pnpm exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify Deployments
        run: |
          echo "Checking service health..."
          curl -sf https://integratewise-mcp-connector.connect-a1b.workers.dev/health || exit 1
          curl -sf https://integratewise-gateway.connect-a1b.workers.dev/health || exit 1
          echo "✅ All services responding"

      - name: Create Deployment Record
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'Production Deploy',
              description: 'All services deployed successfully'
            });

  # Audit Log
  audit-log:
    name: Update Audit Log
    needs: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Log deployment
        run: |
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Deployed by ${GITHUB_ACTOR}" >> deploy.log
          echo "Commit: ${GITHUB_SHA}" >> deploy.log
          echo "Services: normalizer, loader, knowledge, workflow, think, mcp-connector, gateway" >> deploy.log
          echo "---" >> deploy.log

<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IntegrateWise — Unified Shell Mockup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --bg: #0d1117;
        --sidebar-bg: #161b22;
        --border: #30363d;
        --card: #1c2128;
        --text-primary: #e6edf3;
        --text-muted: #848d97;
        --brand: #238636;
        --accent-primary: #58a6ff;
        --radius: 0.5rem;
      }
      .dark {
        --bg: #0d1117;
        --sidebar-bg: #010409;
        --border: #21262d;
        --card: #161b22;
        --text-primary: #e6edf3;
        --text-muted: #848d97;
        --brand: #238636;
        --accent-primary: #58a6ff;
      }
    </style>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              bg: "var(--bg)",
              sidebar: "var(--sidebar-bg)",
              border: "var(--border)",
              card: "var(--card)",
              "text-primary": "var(--text-primary)",
              "text-muted": "var(--text-muted)",
              brand: "var(--brand)",
              accent: "var(--accent-primary)",
            },
            borderRadius: {
              DEFAULT: "var(--radius)",
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-bg text-text-primary antialiased">
    <div class="flex h-screen">
      <!-- ===== SIDEBAR ===== -->
      <aside class="w-64 h-full flex-shrink-0 flex flex-col bg-sidebar border-r border-border">
        <header class="p-4 border-b border-border">
          <h1 class="text-xl font-bold text-accent">IntegrateWise</h1>
          <div class="mt-4">
            <div id="productSwitcher" class="flex gap-1 p-1 rounded-lg bg-bg">
              <button data-product="as" class="flex-1 p-2 text-xs font-semibold rounded-md bg-card">
                Account Success
              </button>
              <button data-product="bi" class="flex-1 p-2 text-xs font-semibold rounded-md">
                Business Intel
              </button>
            </div>
          </div>
        </header>

        <nav class="flex-1 p-2 space-y-4 overflow-y-auto">
          <div>
            <h2 class="px-2 text-xs font-semibold tracking-wider text-text-muted">Workbenches</h2>
            <div id="workbenchNav" class="mt-1 space-y-1">
              <a href="#" data-workbench="user" class="workbench-nav-item bg-card text-accent"
                >User Workbench</a
              >
              <a href="#" data-workbench="cognitive" class="workbench-nav-item"
                >Cognitive Workbench</a
              >
              <a href="#" data-workbench="governance" class="workbench-nav-item"
                >Governance Workbench</a
              >
              <a href="#" data-workbench="claw" class="workbench-nav-item">CLAW/Hermes Workbench</a>
            </div>
          </div>
          <div id="schemaNavContainer">
            <!-- Dynamic content here -->
          </div>
        </nav>

        <footer class="p-4 border-t border-border">
          <div class="flex items-center gap-3">
            <div
              class="w-8 h-8 rounded-full bg-accent flex items-center justify-center font-bold text-bg"
            >
              N
            </div>
            <div>
              <p class="text-sm font-semibold">Nirmal</p>
              <p class="text-xs text-text-muted">Founder / Executive</p>
            </div>
          </div>
        </footer>
      </aside>

      <!-- ===== MAIN WORKBENCH ===== -->
      <main class="flex-1 flex flex-col min-w-0">
        <header class="flex items-center justify-between p-4 border-b border-border bg-sidebar">
          <h1 id="workbenchTitle" class="text-xl font-semibold">Account Success</h1>
          <div class="w-1/3">
            <input
              type="search"
              placeholder="Search..."
              class="w-full px-4 py-2 text-sm rounded-lg bg-bg border border-border focus:outline-none focus:ring-2 focus:ring-accent"
            />
          </div>
        </header>
        <div id="workbenchContent" class="flex-1 p-6 overflow-y-auto">
          <!-- Dynamic content here -->
        </div>
      </main>

      <!-- ===== MEMORY PANEL ===== -->
      <aside class="w-[340px] h-full flex-shrink-0 flex flex-col bg-sidebar border-l border-border">
        <header class="p-2 border-b border-border">
          <div id="memoryTabs" class="flex gap-1 p-1 rounded-lg bg-bg">
            <button data-memory="convo" class="flex-1 p-2 text-xs font-semibold rounded-md bg-card">
              Conversational
            </button>
            <button data-memory="personal" class="flex-1 p-2 text-xs font-semibold rounded-md">
              Personal
            </button>
            <button data-memory="org" class="flex-1 p-2 text-xs font-semibold rounded-md">
              Organizational
            </button>
          </div>
        </header>
        <div id="memoryContent" class="flex-1 p-4 space-y-3 overflow-y-auto">
          <!-- Dynamic content here -->
        </div>
      </aside>
    </div>

    <script>
      // Data structures from previous script
      const AppData = {
        as: {
          name: "Account Success",
          schema: [
            { name: "Account Master" },
            { name: "People / Team" },
            { name: "Business Context" },
            { name: "Strategic Objectives" },
            { name: "Capabilities" },
            { name: "Value Streams" },
            { name: "API Portfolio" },
            { name: "Platform Health Metrics" },
            { name: "Initiatives" },
            { name: "Risk Register" },
            { name: "Stakeholder Outcomes" },
            { name: "Engagement Log" },
            { name: "Success Plan" },
            { name: "Task Manager" },
            { name: "Generated Insights" },
          ],
        },
        bi: {
          name: "Business Intelligence",
          schema: [
            { name: "Strategy & Leadership" },
            { name: "Marketing" },
            { name: "Sales" },
            { name: "Customer Success" },
            { name: "Product" },
            { name: "Engineering" },
            { name: "Operations" },
            { name: "Finance" },
            { name: "Human Resources" },
            { name: "Legal & Compliance" },
            { name: "BI / Analytics" },
            { name: "IT & Infrastructure" },
            { name: "Partnerships & BD" },
            { name: "Knowledge Management" },
          ],
        },
      };
      const workbenchContent = {
        user: (product) =>
          `<div class="p-6 rounded-lg bg-card border border-border"><h3 class="text-lg font-semibold">${product.schema[0].name}</h3><p class="mt-2 text-sm text-text-muted">This area shows the detailed view for the selected layer. Currently viewing the master record for this account.</p></div>`,
        cognitive: () =>
          `<div class="p-6 rounded-lg bg-card border border-border mb-4"><h3 class="font-semibold">Proactive AI Twin</h3><p class="mt-2 text-sm text-text-muted"><strong>At-Risk Account Detected:</strong> Acme Corp's platform health metrics have dropped. Recommend scheduling a health check call.</p></div>`,
        governance: () =>
          `<div class="p-6 rounded-lg bg-card border border-border"><h3 class="font-semibold">Pending Approvals (1)</h3><h4>Renewal Rescue Plan for Acme Corp</h4><p class="text-sm text-text-muted"><strong>Suggestion:</strong> Initiate the 'At-Risk' playbook.</p><div class="mt-4 flex gap-2"><button class="px-4 py-2 text-sm font-semibold text-white bg-brand rounded-lg">Approve</button><button class="px-4 py-2 text-sm font-semibold border border-border rounded-lg">Reject</button></div></div>`,
        claw: () =>
          `<div class="p-4 rounded-lg bg-bg border border-border"><h3 class="font-semibold mb-2">CLAW/Hermes Execution Log</h3><pre class="text-xs text-text-muted whitespace-pre-wrap"><code>[10:31:05] OPERATOR: Executing approved action...\n[10:31:07] SALESFORCE: Updating account status -> SUCCESS</code></pre></div>`,
      };
      const memoryContent = {
        convo: `<div class="p-4 rounded-lg bg-card border border-border"><h4 class="text-sm font-semibold">AI Chat Session</h4><p class="text-xs text-text-muted mt-1">"What's the renewal status?"</p></div>`,
        personal: `<div class="p-4 rounded-lg bg-card border border-border"><h4 class="text-sm font-semibold">Private Note</h4><p class="text-xs text-text-muted mt-1">Reminder: Champion at Acme is a fan of F1.</p></div>`,
        org: `<div class="p-4 rounded-lg bg-card border border-border"><h4 class="text-sm font-semibold">Promoted Insight (SOP)</h4><p class="text-xs text-text-muted mt-1">When API usage drops >20%, trigger playbook.</p></div>`,
      };

      let state = { product: "as", workbench: "user", schemaItem: 0, memory: "convo" };

      const UIElements = {
        productSwitcher: document.getElementById("productSwitcher"),
        workbenchNav: document.getElementById("workbenchNav"),
        schemaNavContainer: document.getElementById("schemaNavContainer"),
        workbenchTitle: document.getElementById("workbenchTitle"),
        workbenchContent: document.getElementById("workbenchContent"),
        memoryTabs: document.getElementById("memoryTabs"),
        memoryContent: document.getElementById("memoryContent"),
      };

      UIElements.workbenchNav.querySelectorAll("a").forEach((el) => {
        el.classList.add(
          "flex",
          "items-center",
          "gap-3",
          "px-3",
          "py-2",
          "text-sm",
          "font-medium",
          "rounded-md",
          "hover:bg-card"
        );
      });

      function render() {
        const productData = AppData[state.product];

        // Product Switcher
        UIElements.productSwitcher.querySelectorAll("button").forEach((btn) => {
          btn.classList.toggle("bg-card", btn.dataset.product === state.product);
        });

        // Workbench Nav
        UIElements.workbenchNav.querySelectorAll("a").forEach((item) => {
          item.classList.toggle("bg-card", item.dataset.workbench === state.workbench);
          item.classList.toggle("text-accent", item.dataset.workbench === state.workbench);
        });

        // Schema Nav
        let schemaHTML = `<h2 class="px-2 mt-4 text-xs font-semibold tracking-wider text-text-muted">Layers</h2><div class="mt-1 space-y-1">`;
        productData.schema.forEach((item, index) => {
          const isActive = state.workbench === "user" && state.schemaItem === index;
          schemaHTML += `<a href="#" data-schema-index="${index}" class="schema-nav-item flex items-center gap-3 px-3 py-2 text-sm font-medium rounded-md hover:bg-card ${isActive ? "bg-card text-text-primary" : "text-text-muted"}">${item.name}</a>`;
        });
        schemaHTML += `</div>`;
        UIElements.schemaNavContainer.innerHTML = schemaHTML;
        UIElements.schemaNavContainer.style.display = state.workbench === "user" ? "block" : "none";

        // Main Content
        const activeWorkbenchItem = UIElements.workbenchNav.querySelector(
          `[data-workbench="${state.workbench}"]`
        );
        UIElements.workbenchTitle.textContent =
          state.workbench === "user"
            ? productData.schema[state.schemaItem].name
            : activeWorkbenchItem.textContent;
        UIElements.workbenchContent.innerHTML = workbenchContent[state.workbench](productData);

        // Memory Panel
        UIElements.memoryTabs.querySelectorAll("button").forEach((btn) => {
          btn.classList.toggle("bg-card", btn.dataset.memory === state.memory);
        });
        UIElements.memoryContent.innerHTML = memoryContent[state.memory];
      }

      // Event Listeners
      UIElements.productSwitcher.addEventListener("click", (e) => {
        if (e.target.tagName === "BUTTON") {
          state.product = e.target.dataset.product;
          state.schemaItem = 0;
          render();
        }
      });
      UIElements.workbenchNav.addEventListener("click", (e) => {
        e.preventDefault();
        const navItem = e.target.closest("a");
        if (navItem) {
          state.workbench = navItem.dataset.workbench;
          render();
        }
      });
      UIElements.schemaNavContainer.addEventListener("click", (e) => {
        e.preventDefault();
        const navItem = e.target.closest(".schema-nav-item");
        if (navItem) {
          state.workbench = "user";
          state.schemaItem = parseInt(navItem.dataset.schemaIndex);
          render();
        }
      });
      UIElements.memoryTabs.addEventListener("click", (e) => {
        if (e.target.tagName === "BUTTON") {
          state.memory = e.target.dataset.memory;
          render();
        }
      });

      render();
    </script>
  </body>
</html>

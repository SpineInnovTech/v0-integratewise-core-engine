<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IntegrateWise — Unified Shell</title>
    <style>
      :root {
        --paper: #f8f6f2;
        --rule: #e0dcd5;
        --ink: #1a1714;
        --muted: #7a756d;
        --gold: #b8943f;
        --red: #c0392b;
        --green: #27ae60;
        --blue: #2980b9;
        --purple: #8e44ad;
        --sidebar-bg: #1a1714;
        --sidebar-text: #d4d0ca;
        --sidebar-active: #ffffff;
        --sidebar-width: 250px;
        --twin-width: 340px;
        --topbar-height: 60px;
      }

      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--paper);
        color: var(--ink);
        height: 100vh;
        overflow: hidden;
      }

      .shell-grid {
        display: grid;
        height: 100vh;
        grid-template-columns: var(--sidebar-width) 1fr var(--twin-width);
        grid-template-rows: var(--topbar-height) 1fr;
        grid-template-areas:
          "sidebar topbar topbar"
          "sidebar main twin";
      }

      /* --- SIDEBAR --- */
      .sidebar {
        grid-area: sidebar;
        background: var(--sidebar-bg);
        color: var(--sidebar-text);
        display: flex;
        flex-direction: column;
        border-right: 1px solid #2a2622;
      }
      .sidebar-header {
        padding: 20px;
        border-bottom: 1px solid #2a2622;
      }
      .sidebar-logo {
        font-size: 20px;
        font-weight: 700;
        color: var(--sidebar-active);
      }
      .sidebar-logo span {
        color: var(--gold);
      }
      .sidebar-nav {
        flex: 1;
        padding: 12px 0;
      }
      .nav-section-title {
        padding: 8px 20px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        color: var(--muted);
        letter-spacing: 0.5px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 20px;
        cursor: pointer;
        border-left: 3px solid transparent;
        font-size: 14px;
      }
      .nav-item:hover {
        background: #221f1b;
        color: var(--sidebar-active);
      }
      .nav-item.active {
        background: #25221e;
        color: var(--sidebar-active);
        border-left-color: var(--gold);
        font-weight: 600;
      }
      .nav-item.sub-item {
        padding-left: 48px;
        font-size: 13px;
      }
      .sidebar-footer {
        padding: 16px;
        border-top: 1px solid #2a2622;
      }

      /* --- TOP BAR --- */
      .topbar {
        grid-area: topbar;
        background: #fff;
        border-bottom: 1px solid var(--rule);
        display: flex;
        align-items: center;
        padding: 0 24px;
      }
      .topbar-search {
        position: relative;
        flex: 1;
        max-width: 450px;
        margin: 0 auto;
      }
      .topbar-search input {
        width: 100%;
        padding: 8px 16px 8px 40px;
        border-radius: 20px;
        border: 1px solid var(--rule);
        background: var(--paper);
        outline: none;
      }
      .topbar-search svg {
        position: absolute;
        left: 14px;
        top: 9px;
        width: 16px;
        height: 16px;
        stroke: var(--muted);
      }

      /* --- MAIN CONTENT --- */
      .main {
        grid-area: main;
        overflow-y: auto;
        padding: 28px;
      }
      .page-title {
        font-size: 26px;
        font-weight: 700;
      }
      .page-subtitle {
        color: var(--muted);
        margin-top: 4px;
      }
      .personal-org-tabs {
        display: flex;
        gap: 4px;
        background: #edeae4;
        padding: 4px;
        border-radius: 20px;
        margin: 20px 0;
        width: fit-content;
      }
      .personal-org-tabs div {
        padding: 6px 20px;
        border-radius: 16px;
        font-size: 13px;
        cursor: pointer;
      }
      .personal-org-tabs div.active {
        background: var(--sidebar-bg);
        color: #fff;
        font-weight: 500;
      }

      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-top: 24px;
      }
      .kpi-card {
        background: #fff;
        padding: 20px;
        border-radius: 12px;
        border: 1px solid var(--rule);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      }
      .kpi-title {
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
      }
      .kpi-value {
        font-size: 28px;
        font-weight: 700;
        margin: 8px 0;
      }

      /* --- TWIN WORKBENCH (RIGHT SIDEBAR) --- */
      .twin-workbench {
        grid-area: twin;
        background: #edeae4;
        border-left: 1px solid var(--rule);
        display: flex;
        flex-direction: column;
      }
      .twin-header {
        padding: 16px;
        background: #fff;
        border-bottom: 1px solid var(--rule);
      }
      .twin-tabs {
        display: flex;
        background: #e6e3dd;
        padding: 4px;
        border-radius: 20px;
      }
      .twin-tabs div {
        flex: 1;
        text-align: center;
        padding: 6px 0;
        font-size: 12px;
        border-radius: 16px;
        cursor: pointer;
      }
      .twin-tabs div.active {
        background: var(--sidebar-bg);
        color: #fff;
        font-weight: 500;
      }
      .twin-content {
        flex: 1;
        padding: 16px;
        overflow-y: auto;
      }
      .memory-item {
        background: #fff;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #e0dcd5;
        margin-bottom: 12px;
        font-size: 13px;
      }
      .memory-item-title {
        font-weight: 600;
        margin-bottom: 4px;
      }
      .memory-item-meta {
        font-size: 11px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="shell-grid">
      <!-- ===== SIDEBAR ===== -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo">Integrate<span>Wise</span></div>
        </div>
        <nav class="sidebar-nav">
          <div class="nav-section-title">Workbenches</div>
          <div id="nav-user" class="nav-item active" onclick="switchWorkbench('user')">
            User Workbench
          </div>
          <div id="nav-intelligence" class="nav-item" onclick="switchWorkbench('intelligence')">
            Intelligence
          </div>
          <div id="nav-governance" class="nav-item" onclick="switchWorkbench('governance')">
            Governance Bench
          </div>

          <div style="height: 1px; background: #2a2622; margin: 12px 0"></div>

          <div id="domain-nav-container">
            <div class="nav-section-title">Domains</div>
            <div class="nav-item" onclick="switchDomain('BI')">Business Intelligence</div>
            <div class="nav-item sub-item active" onclick="switchDomain('CS')">
              Customer Success
            </div>
            <div class="nav-item sub-item" onclick="switchDomain('Sales')">Sales</div>
            <div class="nav-item sub-item" onclick="switchDomain('Marketing')">Marketing</div>
            <!-- ... other domains -->
          </div>
        </nav>
        <div class="sidebar-footer">
          <!-- Footer content -->
        </div>
      </aside>

      <!-- ===== TOP BAR ===== -->
      <header class="topbar">
        <div>Breadcrumb / Goes / Here</div>
        <div class="topbar-search">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" placeholder="Search across Spine, Memory, and Workflows..." />
        </div>
        <div>Actions</div>
      </header>

      <!-- ===== MAIN CONTENT ===== -->
      <main class="main" id="main-content">
        <!-- JS will populate this -->
      </main>

      <!-- ===== TWIN WORKBENCH (RIGHT SIDEBAR) ===== -->
      <aside class="twin-workbench">
        <div class="twin-header">
          <div class="twin-tabs">
            <div id="twin-tab-convo" class="active" onclick="switchTwinTab('convo')">
              Conversational
            </div>
            <div id="twin-tab-org" onclick="switchTwinTab('org')">Org Memory</div>
            <div id="twin-tab-wf" onclick="switchTwinTab('wf')">Workflows</div>
          </div>
        </div>
        <div class="twin-content" id="twin-content">
          <!-- JS will populate this -->
        </div>
      </aside>
    </div>

    <script>
      const contentAreas = {
        user: {
          title: "Customer Success",
          subtitle: "Managing account health, renewals, and engagement.",
          hasTabs: true,
          personal: `
                <div class="kpi-grid">
                    <div class="kpi-card"><div class="kpi-title">My Open Tasks</div><div class="kpi-value">8</div></div>
                    <div class="kpi-card"><div class="kpi-title">My At-Risk Accounts</div><div class="kpi-value">3</div></div>
                    <div class="kpi-card"><div class="kpi-title">My Upcoming Renewals</div><div class="kpi-value">$1.2M</div></div>
                </div>
                <p style="margin-top:20px;">Personal dashboard with tasks, notes, and private metrics...</p>`,
          org: `
                <div class="kpi-grid">
                    <div class="kpi-card"><div class="kpi-title">Team ARR</div><div class="kpi-value">$24.7M</div></div>
                    <div class="kpi-card"><div class="kpi-title">Accounts At-Risk</div><div class="kpi-value">12</div></div>
                    <div class="kpi-card"><div class="kpi-title">Q2 Expansion</div><div class="kpi-value">$850k</div></div>
                </div>
                <p style="margin-top:20px;">Shared department dashboard with playbooks, SOPs, and team metrics...</p>`,
        },
        intelligence: {
          title: "Intelligence Surface",
          subtitle: "Lightweight signals and proactive insights from the Cognitive Layer.",
          hasTabs: false,
          content: `
                <div class="kpi-grid">
                    <div class="kpi-card"><div class="kpi-title">New Signals</div><div class="kpi-value">7</div></div>
                    <div class="kpi-card"><div class="kpi-title">Data Drift Detected</div><div class="kpi-value">-8%</div></div>
                    <div class="kpi-card"><div class="kpi-title">Proactive Suggestions</div><div class="kpi-value">4</div></div>
                </div>`,
        },
        governance: {
          title: "Governance Bench",
          subtitle: "Review, approve, or reject AI-proposed actions.",
          hasTabs: false,
          content: `
                <div style="background:#fff; border:1px solid var(--rule); padding:20px; border-radius:12px;">
                    <h3 style="font-size:16px;">Pending Action: Renewal Rescue Plan</h3>
                    <p style="color:var(--muted); font-size:13px;">For: Acme Corp</p>
                    <div style="margin-top:16px; display:flex; gap:12px;">
                        <button style="background:var(--green); color:#fff; border:0; padding:8px 20px; border-radius:8px; cursor:pointer;">Approve</button>
                        <button style="background:var(--paper); border:1px solid var(--red); color:var(--red); padding:8px 20px; border-radius:8px; cursor:pointer;">Reject</button>
                    </div>
                </div>`,
        },
      };

      const twinTabsContent = {
        convo: `
            <div class="memory-item">
                <div class="memory-item-title">Acme Corp QBR Prep</div>
                <div class="memory-item-meta">Personal Session • 2 hours ago</div>
            </div>
            <div class="memory-item">
                <div class="memory-item-title">DataZen API Issue</div>
                <div class="memory-item-meta">Personal Session • Yesterday</div>
            </div>`,
        org: `
            <div class="memory-item">
                <div class="memory-item-title">CS Renewal Playbook v3</div>
                <div class="memory-item-meta">Org Knowledge • Promoted 3 days ago</div>
            </div>`,
        wf: `
            <div class="memory-item">
                <div class="memory-item-title">[Workflow] Churn Alert Sent</div>
                <div class="memory-item-meta">CLAW/Hermes • 15 mins ago</div>
            </div>`,
      };

      function renderMain(workbenchKey) {
        const data = contentAreas[workbenchKey];
        const mainEl = document.getElementById("main-content");

        let tabsHTML = "";
        if (data.hasTabs) {
          tabsHTML = `
                <div class="personal-org-tabs" id="personal-org-tabs">
                    <div class="active" onclick="renderSubView('${workbenchKey}', 'personal')">Personal</div>
                    <div onclick="renderSubView('${workbenchKey}', 'org')">Org</div>
                </div>`;
        }

        mainEl.innerHTML = `
            <h1 class="page-title">${data.title}</h1>
            <p class="page-subtitle">${data.subtitle}</p>
            ${tabsHTML}
            <div id="view-content">${data.hasTabs ? data.personal : data.content}</div>`;
      }

      function renderSubView(workbenchKey, subView) {
        document.getElementById("view-content").innerHTML = contentAreas[workbenchKey][subView];
        const tabs = document.querySelectorAll("#personal-org-tabs div");
        tabs.forEach((tab) => {
          if (tab.innerText.toLowerCase() === subView) {
            tab.classList.add("active");
          } else {
            tab.classList.remove("active");
          }
        });
      }

      function switchWorkbench(key) {
        document
          .querySelectorAll(".sidebar .nav-item")
          .forEach((item) => item.classList.remove("active"));
        document.getElementById(`nav-${key}`).classList.add("active");
        renderMain(key);
      }

      function switchTwinTab(key) {
        document
          .querySelectorAll(".twin-tabs div")
          .forEach((item) => item.classList.remove("active"));
        document.getElementById(`twin-tab-${key}`).classList.add("active");
        document.getElementById("twin-content").innerHTML = twinTabsContent[key];
      }

      // Initial render
      switchWorkbench("user");
      switchTwinTab("convo");
    </script>
  </body>
</html>

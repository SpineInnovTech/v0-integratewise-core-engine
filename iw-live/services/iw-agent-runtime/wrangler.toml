name = "iw-agent-runtime"
main = "src/index.ts"
compatibility_date = "2026-06-09"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "dev"
LOG_LEVEL = "debug"
DEFAULT_TENANT_ID = "iw-customer-zero"
DEFAULT_CHAT_MODEL = "openrouter/openai/gpt-5-mini"

# Direct D1 binding for spine read operations
[[d1_databases]]
binding = "D1"
database_name = "integratewise-spine-cache"
database_id = "ed1f534a-df1e-4783-8a74-8d6d70d067ff"

# Direct KV binding for cache
[[kv_namespaces]]
binding = "CACHE"
id = "18aa20dfeb304f0ba592d9070964dd31"

# Workers AI binding
[ai]
binding = "AI"

# Service bindings — internal routing between live Cloudflare services only.
# Twin runtime is 100% Cloudflare-native (D1 + KV + Workers AI + DOs + service bindings).
# No VPS, no n8n, no external dependencies per DECISION 22.
[[services]]
binding = "INTELLIGENCE"
service = "intelligence"

[[services]]
binding = "PIPELINE"
service = "integratewise-pipeline"

[[services]]
binding = "CONTINUITY"
service = "continuity"

# dev targets must equal each worker's `name=` (connector/knowledge),
# not the package name, or wrangler deploy of this worker fails.
[[services]]
binding = "CONNECTOR"
service = "connector"

[[services]]
binding = "KNOWLEDGE"
service = "knowledge"

# Durable Object bindings
[[durable_objects.bindings]]
name = "TWIN_AGENT"
class_name = "TwinAgent"

[[durable_objects.bindings]]
name = "TENANT_BRAIN"
class_name = "TenantBrainDO"

# Class registration migrations
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TwinAgent", "TenantBrainDO"]


[dev]
port = 8808
inspector_port = 9268

# ⚠️  DEPRECATED — Standalone Normalizer worker.
# v3.6 consolidated this into integratewise-pipeline (see services/pipeline/).
# If you must deploy this standalone worker for local dev, these bindings now
# point to the consolidated workers so they don't create split-brain.
name = "integratewise-normalizer"
account_id = "a1bbbb12a32cdbb68dd170b09fe8b5f3"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Observability (see docs/WORKERS_OBSERVABILITY_OTLP.md)
[observability]
enabled = true
[observability.logs]
enabled = true
head_sampling_rate = 1
[observability.traces]
enabled = true
head_sampling_rate = 0.1

# Secrets from Cloudflare Secrets Store — replace 1fd83fc5881e4cd296ae3c2fbe80693c (see docs/SECRETS_STORE_SETUP.md)
[[secrets_store_secrets]]
binding = "SUPABASE_URL"
store_id = "1fd83fc5881e4cd296ae3c2fbe80693c"
secret_name = "SUPABASE_URL"

[[secrets_store_secrets]]
binding = "SUPABASE_SERVICE_ROLE_KEY"
store_id = "1fd83fc5881e4cd296ae3c2fbe80693c"
secret_name = "SUPABASE_SERVICE_ROLE_KEY"

# REMOVED: queue consumers for "pipeline-process" and "accelerator-trigger" —
# consolidated worker (integratewise-pipeline) is the sole consumer. Deploying
# this standalone worker with the consumers caused competing consumers (split-brain).
# See: services/pipeline/wrangler.toml

# Produces to multiple queues (producers are safe — no split-brain risk)
[[queues.producers]]
queue = "pipeline-process"
binding = "PIPELINE_QUEUE"

[[queues.producers]]
queue = "knowledge-ingest"
binding = "KNOWLEDGE_QUEUE"

[[queues.producers]]
queue = "accelerator-trigger"
binding = "ACCELERATOR_QUEUE"

[[queues.producers]]
queue = "intelligence-events"
binding = "INTELLIGENCE_QUEUE"

[[queues.producers]]
queue = "ops-dlq"
binding = "DLQ_QUEUE"

[[queues.producers]]
queue = "signals"
binding = "SIGNAL_QUEUE"

# D1 cache for entity360 edge projection
[[d1_databases]]
binding = "D1"
database_name = "integratewise-spine-cache"
database_id = "ed1f534a-df1e-4783-8a74-8d6d70d067ff"

# KV signal cache for quick metrics retrieval
[[kv_namespaces]]
binding = "SIGNAL_CACHE"
id = "747166a3165444d1a9c9c8c54abbd93a"

[[kv_namespaces]]
binding = "METRICS"
id = "e80ee409f5be4bf8a9556c0917c113e2"

# Service binding — v3.6: SPINE points to consolidated pipeline worker
[[services]]
binding = "SPINE"
service = "integratewise-pipeline"

# BFF/Workflow service binding — for entity update broadcasts (Flow C B5/B6/B7)
[[services]]
binding = "BFF"
service = "integratewise-bff"

[vars]
ENABLE_SIGNALS = "true"

[env.staging]
name = "integratewise-normalizer-staging"
account_id = "a1bbbb12a32cdbb68dd170b09fe8b5f3"

[env.production]
name = "integratewise-normalizer"
account_id = "a1bbbb12a32cdbb68dd170b09fe8b5f3"

[dev]
inspector_port = 9253
port = 8793

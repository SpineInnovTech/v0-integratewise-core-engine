service = "pipeline-prod"

[[env.prod.services]]
binding = "THINK"
service = "intelligence-prod"

[[env.prod.services]]
binding = "IQ_HUB"
service = "knowledge-prod"

# AI binding for prod
[env.prod.ai]
binding = "AI"

# Vectorize binding for prod
[[env.prod.vectorize]]

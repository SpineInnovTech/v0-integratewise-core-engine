name = "integratewise-tenants"
account_id = "a1bbbb12a32cdbb68dd170b09fe8b5f3"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# ─── D1 Database (tenants, tenant_users, workspaces) ───
[[d1_databases]]
binding = "DB"
database_name = "integratewise-spine-cache"
database_id = "ed1f534a-df1e-4783-8a74-8d6d70d067ff"
migrations_dir = "migrations"

# ─── Secrets from Cloudflare Secrets Store ───
# Store ID: 1fd83fc5881e4cd296ae3c2fbe80693c (see docs/SECRETS_STORE_SETUP.md)
# NOTE: Tenants is embedded in Gateway (v3.6). These bindings are needed for
#       standalone dev/deploy. Production uses Gateway's bindings.

# --- Core infrastructure (Supabase for connectors table only) ---
[[secrets_store_secrets]]
binding = "SUPABASE_URL"
store_id = "1fd83fc5881e4cd296ae3c2fbe80693c"
secret_name = "SUPABASE_URL"

[[secrets_store_secrets]]
binding = "SUPABASE_SERVICE_ROLE_KEY"
store_id = "1fd83fc5881e4cd296ae3c2fbe80693c"
secret_name = "SUPABASE_SERVICE_ROLE_KEY"

[[secrets_store_secrets]]
binding = "TOKEN_ENCRYPTION_KEY"
store_id = "1fd83fc5881e4cd296ae3c2fbe80693c"
secret_name = "TOKEN_ENCRYPTION_KEY"

# --- OAuth Provider Credentials (Tier 1 — required for demo) ---
# CRM
[[secrets_store_secrets]]
binding = "HUBSPOT_CLIENT_ID"
store_id = "1fd83fc5881e4cd296ae3c2fbe80693c"
secret_name = "HUBSPOT_CLIENT_ID"

[[secrets_store_secrets]]
binding = "HUBSPOT_CLIENT_SECRET"
store_id = "1fd83fc5881e4cd296ae3c2fbe80693c"
secret_name = "HUBSPOT_CLIENT_SECRET"

[[secrets_store_secrets]]
binding = "SALESFORCE_CLIENT_ID"
store_id = "1fd83fc5881e4cd296ae3c2fbe80693c"
secret_name = "SALESFORCE_CLIENT_ID"

[[secrets_store_secrets]]
binding = "SALESFORCE_CLIENT_SECRET"
store_id = "1fd83fc5881e4cd296ae3c2fbe80693c"
secret_name = "SALESFORCE_CLIENT_SECRET"

# Google (covers Gmail, Drive, Sheets, Calendar)
[[secrets_store_secrets]]
binding = "GOOGLE_CLIENT_ID"
store_id = "1fd83fc5881e4cd296ae3c2fbe80693c"

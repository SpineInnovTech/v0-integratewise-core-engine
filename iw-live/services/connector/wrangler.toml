# Consolidated Connector Worker (v3.6 Architecture)
# Merges: loader + mcp-connector + store
name = "connector"
account_id = "a1bbbb12a32cdbb68dd170b09fe8b5f3"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Observability (see docs/WORKERS_OBSERVABILITY_OTLP.md)
[observability]
enabled = true
[observability.logs]
enabled = true
head_sampling_rate = 1
[observability.traces]
enabled = true
head_sampling_rate = 0.1

# Secrets from Cloudflare Secrets Store — replace 1fd83fc5881e4cd296ae3c2fbe80693c (see docs/SECRETS_STORE_SETUP.md)
# NANGO for REAL user connections (OAuth to HubSpot, Jira, GitHub, etc.)
# 1. Sign up / log in at https://app.nango.dev
# 2. For each app you want users to connect (from the expanded NANGO_INTEGRATION_MAP):
#    - Create OAuth app in the provider (HubSpot App, Jira OAuth, GitHub OAuth App, etc.)
#    - In Nango → Integrations, add the integration and paste the client ID/secret.
#    - Copy the redirect URI Nango gives you into the provider's OAuth settings.
# 3. In Nango dashboard, copy your "Secret Key" (for the environment: Prod or Dev).
# 4. Also set Webhook secret if using /webhooks/nango.
# 5. Put into CF Secrets Store (or wrangler secret put):
#    NANGO_SECRET_KEY=your-nango-secret
#    NANGO_WEBHOOK_SECRET=your-webhook-secret (optional)
#
# For nango dev (local testing): NANGO_BASE_URL=http://localhost:3003
# In wrangler dev: use .dev.vars with NANGO_BASE_URL=...
# vars:
# NANGO_BASE_URL = "http://localhost:3003"  # for dev only
# Set in .dev.vars for local wrangler dev.

# Core connector paths use D1 (DECISION 22). Nango is for auth brokering only.
[[secrets_store_secrets]]
binding = "NANGO_SECRET_KEY"
store_id = "1fd83fc5881e4cd296ae3c2fbe80693c"
secret_name = "NANGO_SECRET_KEY"

# [[secrets_store_secrets]]
# binding = "NANGO_WEBHOOK_SECRET"
# store_id = "1fd83fc5881e4cd296ae3c2fbe80693c"
# secret_name = "NANGO_WEBHOOK_SECRET"

# Legacy Supabase (only for sub-loader compatibility during migration — guard all paths).
[[secrets_store_secrets]]
binding = "SUPABASE_URL"
store_id = "1fd83fc5881e4cd296ae3c2fbe80693c"
secret_name = "SUPABASE_URL"

[[secrets_store_secrets]]
binding = "SUPABASE_SERVICE_ROLE_KEY"
store_id = "1fd83fc5881e4cd296ae3c2fbe80693c"
secret_name = "SUPABASE_SERVICE_ROLE_KEY"

[[secrets_store_secrets]]
binding = "DATABASE_URL"
store_id = "1fd83fc5881e4cd296ae3c2fbe80693c"
secret_name = "DATABASE_URL"

[[secrets_store_secrets]]
binding = "TOKEN_ENCRYPTION_KEY"
store_id = "1fd83fc5881e4cd296ae3c2fbe80693c"
secret_name = "TOKEN_ENCRYPTION_KEY"




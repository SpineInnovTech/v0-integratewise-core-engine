[[queues.producers]]
queue = "pipeline-process"
binding = "PIPELINE_QUEUE"

# From mcp-connector: sessions → knowledge
[[queues.producers]]
queue = "knowledge-ingest"
binding = "KNOWLEDGE_QUEUE"

# --- KV Namespaces ---

# From loader/mcp-connector: idempotency checks
[[kv_namespaces]]
binding = "MCP_IDEMPOTENCY"
id = "16510bf2287a45d8b24163ddafd3d302"

# Optional: installation mappings + connector status (shared KV used by webhook-ingress)
[[kv_namespaces]]
binding = "CONNECTOR_STATUS"
id = "f7a3d773ff2841f7954d3cfeae82594f"

# --- D1 for connector cursors + dedup ---

[[d1_databases]]
binding = "EDGE_DB"
database_name = "integratewise-spine-cache"
database_id = "ed1f534a-df1e-4783-8a74-8d6d70d067ff"

# --- R2 for file storage (from store) ---

[[r2_buckets]]
binding = "FILES"
bucket_name = "integratewise-files-prod"

# Optional MCP auth: wrangler secret put MCP_CONNECTOR_API_KEY
# MCP_CONNECTOR_API_KEY = Bearer/X-MCP-Key for /tools and /invoke.



# ⚠️  DEPRECATED — Standalone Act worker.
# v3.6 consolidated this into integratewise-intelligence (see services/intelligence/).
# If you must deploy this standalone worker for local dev, these bindings now
# point to the consolidated workers so they don't create split-brain.
name = "integratewise-act"
account_id = "a1bbbb12a32cdbb68dd170b09fe8b5f3"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Secrets from Cloudflare Secrets Store — replace 1fd83fc5881e4cd296ae3c2fbe80693c (see docs/SECRETS_STORE_SETUP.md)
[[secrets_store_secrets]]
binding = "SUPABASE_URL"
store_id = "1fd83fc5881e4cd296ae3c2fbe80693c"
secret_name = "SUPABASE_URL"

[[secrets_store_secrets]]
binding = "SUPABASE_SERVICE_KEY"
store_id = "1fd83fc5881e4cd296ae3c2fbe80693c"
secret_name = "SUPABASE_SERVICE_KEY"

# REMOVED: queue consumer for "intelligence-act" — consolidated worker
# (integratewise-intelligence) is the sole consumer. See: services/intelligence/wrangler.toml

# Connector for tool write-back (OAuth'd providers)
[[services]]
binding = "CONNECTOR"
service = "integratewise-connector"

# Governance hard gate (v3.6: points to consolidated intelligence worker)
[[services]]
binding = "GOVERN"
service = "integratewise-intelligence"

# Pipeline for re-ingestion (closes the REPEAT loop)
[[services]]
binding = "PIPELINE"
service = "integratewise-pipeline"

# Queue producer for pipeline re-ingestion (producers are safe — no split-brain risk)
[[queues.producers]]
queue = "pipeline-process"
binding = "PIPELINE_QUEUE"

[env.staging]
name = "integratewise-act-staging"
account_id = "a1bbbb12a32cdbb68dd170b09fe8b5f3"

[env.production]
name = "integratewise-act"
account_id = "a1bbbb12a32cdbb68dd170b09fe8b5f3"

[dev]
inspector_port = 9240
port = 8780

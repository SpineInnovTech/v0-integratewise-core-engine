# Twin Orchestrator — Cognitive Orchestration Layer
# NOT an AI infrastructure worker — this is the reasoning/coordination layer

name = "twin-orchestrator"
account_id = "a1bbbb12a32cdbb68dd170b09fe8b5f3"
main = "src/index.ts"
compatibility_date = "2026-06-09"
compatibility_flags = ["nodejs_compat"]

# Custom domain
route = { pattern = "twin.dev.integratewise.ai", custom_domain = true }

# Scheduled orchestration loop (every 5 minutes)
[triggers]
crons = ["*/5 * * * *"]  # Every 5 minutes: observe → reason → propose → coordinate

[vars]
ENVIRONMENT = "dev"
LOG_LEVEL = "debug"
OBSERVE_INTERVAL_MINUTES = "5"

# Service bindings — Twin orchestrates via these
[[services]]
binding = "MCP_CONNECTOR"
service = "integratewise-mcp-connector"

[[services]]
binding = "INTELLIGENCE"
service = "intelligence"

[[services]]
binding = "PIPELINE"
service = "integratewise-pipeline"

[[services]]
binding = "KNOWLEDGE"
service = "integratewise-knowledge"

[[services]]
binding = "CONTINUITY"
service = "continuity"

# D1 for Twin state + proposals
[[d1_databases]]
binding = "D1"
database_name = "integratewise-spine-cache"
database_id = "ed1f534a-df1e-4783-8a74-8d6d70d067ff"

# KV for Twin context cache
[[kv_namespaces]]
binding = "CACHE"
id = "18aa20dfeb304f0ba592d9070964dd31"


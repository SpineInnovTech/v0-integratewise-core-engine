name = "gateway"
account_id = "a1bbbb12a32cdbb68dd170b09fe8b5f3"
main = "src/index.ts"
compatibility_date = "2026-06-03"
compatibility_flags = ["nodejs_compat"]

# Custom domain for dev
route = { pattern = "gateway.dev.integratewise.ai", custom_domain = true }

# ─── D1 Database (auth reads tenant/user records) ───
[[d1_databases]]
binding = "DB"
database_name = "integratewise-spine-cache"
database_id = "ed1f534a-df1e-4783-8a74-8d6d70d067ff"


# Observability — traces and logs
[observability]
enabled = true
[observability.logs]
enabled = true
head_sampling_rate = 1
[observability.traces]
enabled = true
head_sampling_rate = 0.1


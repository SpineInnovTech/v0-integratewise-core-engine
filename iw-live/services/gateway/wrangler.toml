# ═══════════════════════════════════════════════
# DEFAULT = DEV (no flags needed for wrangler deploy)
# ═══════════════════════════════════════════════

[vars]
ENVIRONMENT = "dev"
TENANT_HEADER = "x-tenant-id"
AI_GATEWAY_ID = "integratewise-ai-dev"
LOG_LEVEL = "debug"
ENABLE_SIGNALS = "true"

# Service bindings to sibling Workers (dev instances)
[[services]]
binding = "PIPELINE"
service = "integratewise-pipeline"

[[services]]
binding = "AGENT_RUNTIME"
service = "iw-agent-runtime"

[[services]]
binding = "INTELLIGENCE"
service = "intelligence"

# Additional service bindings (v3.6 consolidated model)
# NOTE: dev binding targets MUST equal each worker's `name=` (not the
# "integratewise-*" package name) or `wrangler deploy` fails with
# "service not found". These now match the deployed worker names.
[[services]]
binding = "CONNECTOR"
service = "connector"

[[services]]
binding = "CONNECTOR_SYNC"
service = "integratewise-connector-sync"

[[services]]
binding = "KNOWLEDGE"
service = "knowledge"

# BFF is the workflow worker (prod binds workflow-prod). Optional in dev —
# fetchService() degrades gracefully if it is not deployed.
[[services]]
binding = "BFF"
service = "workflow"

[[services]]
binding = "L2"
service = "l2"

[[services]]
binding = "WEBHOOK_INGRESS"
service = "integratewise-webhook-ingress"

# NOTE: FOLDER_WATCHER binding removed — folder-watcher worker not yet deployed.
# Re-add once folder-watcher is live on Cloudflare.
# [[services]]
# binding = "FOLDER_WATCHER"
# service = "folder-watcher"

# AI binding (routes through AI Gateway in code)
[ai]
binding = "AI"

# KV for rate limiting + session cache
[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "8f61d841d2574061ac1d547187d72a58"

[[kv_namespaces]]
binding = "SESSIONS"
id = "508ba759f7a44ca8aaaf8502d603077b"

[[kv_namespaces]]
binding = "CONNECTOR_STATUS"
id = "f7a3d773ff2841f7954d3cfeae82594f"

[[kv_namespaces]]
binding = "SIGNAL_CACHE"
id = "747166a3165444d1a9c9c8c54abbd93a"

[[kv_namespaces]]
binding = "METRICS"
id = "e80ee409f5be4bf8a9556c0917c113e2"

[[kv_namespaces]]
binding = "OAUTH_STATE_KV"
id = "d610b2da55bf437ba90444f93077e1c6"

# Custom domain for dev

[dev]
inspector_port = 9246
port = 8786


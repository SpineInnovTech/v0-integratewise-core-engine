kind = "web"
previewPath = "/review/"
title = "IntegrateWise — 4-Day Build Review"
version = "1.0.0"
id = "artifacts/review"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/review/" ]
localPort = 21839

[services.development]
run = "pnpm --filter @workspace/review run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/review", "run", "build" ]
publicDir = "artifacts/review/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21839"
BASE_PATH = "/review/"
